services:
  - type: web
    name: scifxaic
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: SLACK_SIGNING_SECRET
        sync: false
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: FINNHUB_API_KEY
        sync: false
      - key: SLACK_CHANNEL_ID
        sync: false

  # Frontend: Vite static build. VITE_* vars are BUILD-time — set real values in
  # the Render dashboard before the first build; changing them requires a rebuild.
  # The rewrite rule replaces frontend/public/_redirects (Netlify syntax, which
  # Render ignores) so react-router deep links serve index.html.
  - type: web
    name: scifxaic-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
